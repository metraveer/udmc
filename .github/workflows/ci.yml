name: CI

on:
  # Tags are handled by the release workflow: without this filter every release
  # ran the whole suite twice and reported two results for one commit.
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

# A newer push makes the previous check pointless: cancelling it saves minutes and
# stops obsolete failure notifications from piling up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run version:check
      - run: node --check apps/admin-desktop/ui/assets/admin.js

  agents:
    name: Fabric and NeoForge agents
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: npm run minecraft:build
      - uses: actions/upload-artifact@v4
        with:
          name: udmc-sync-agent
          path: apps/admin-desktop/src-tauri/agent-templates/

  login:
    name: Player login against a real server
    runs-on: ubuntu-latest
    # The handshake is where the bugs that stop people playing live, and no unit test reaches
    # it. minecraft-protocol knows 1.21.1 and not 26.x, so this walks 1.21.1; the payload
    # codecs the other versions use are held to it by consistency.test.js.
    timeout-minutes: 25
    env:
      GRADLE_OPTS: -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run minecraft:build
      - run: npm run e2e:login -- 1.21.1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-server-console
          path: .qa/fabric-1.21.1-e2e/server-console.log
      # The same matrix with the whole of Fabric API on the server: the configuration a new
      # player actually meets, and the one where Fabric API runs the configuration queue in a
      # loop of its own. Every earlier attempt at this check worked in exactly one of the two.
      - run: npm run e2e:login -- 1.21.1 fabric-api
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-server-console-fabric-api
          path: .qa/fabric-1.21.1-e2e/server-console.log

  windows:
    name: UDMC Control
    needs: agents
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: udmc-sync-agent
          path: apps/admin-desktop/src-tauri/agent-templates/
      - run: npm run admin:prepare
      - run: cargo fmt --manifest-path apps/admin-desktop/src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path apps/admin-desktop/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path apps/admin-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      # Only the release workflow bundles and signs the installer: the signing key
      # never reaches ordinary pushes, so CI compiles the application instead.
      - run: npm run admin:compile
      - uses: actions/upload-artifact@v4
        with:
          name: udmc-control-windows
          path: apps/admin-desktop/src-tauri/target/release/udmc-control.exe
