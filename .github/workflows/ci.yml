name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run version:check
      - run: npm run smoke
      - run: node --check apps/admin-desktop/ui/assets/admin.js

  agents:
    name: Fabric and NeoForge agents
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: npm run minecraft:build
      - uses: actions/upload-artifact@v4
        with:
          name: udmc-sync-agent
          path: apps/admin-desktop/src-tauri/agent-templates/

  windows:
    name: UDMC Control
    needs: agents
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: udmc-sync-agent
          path: apps/admin-desktop/src-tauri/agent-templates/
      - run: npm run admin:prepare
      - run: cargo fmt --manifest-path apps/admin-desktop/src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path apps/admin-desktop/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path apps/admin-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run admin:build
      - uses: actions/upload-artifact@v4
        with:
          name: udmc-control-windows
          path: |
            apps/admin-desktop/src-tauri/target/release/udmc-control.exe
            apps/admin-desktop/src-tauri/target/release/bundle/nsis/*.exe
